[project]
name = "vnflow-backend"
version = "0.1.0"
description = "Local visual novel studio: LLM-drafted dialogue + local image generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "websockets>=12.0",
]

[project.optional-dependencies]
# Direct model inference + LoRA training (CUDA or Apple MPS)
image = [
    "torch>=2.4",
    "torchvision>=0.19",
    "diffusers>=0.32",
    "transformers>=4.46",
    "accelerate>=1.0",
    "peft>=0.13",
    "safetensors>=0.4",
    "numpy>=1.26",
]
# WD14 tagger for auto-captioning training images
tagger = [
    "onnxruntime>=1.19",
    "huggingface_hub>=0.25",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
